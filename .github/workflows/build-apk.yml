name: Build Wave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Wave Android APK (Sing-box Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold & Maven mirror
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create --platforms=android --org com.wave --project-name wave .
          fi
          cp -f android_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/wave/vpn
          cp -f android_src/MainActivity.kt android/app/src/main/kotlin/com/wave/vpn/MainActivity.kt
          cp -f android_src/WaveVpnService.kt android/app/src/main/kotlin/com/wave/vpn/WaveVpnService.kt

          # Зеркало Maven для стабильности загрузки
          find "$FLUTTER_ROOT/packages/flutter_tools/gradle" android -type f \( -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }|g' {} + || true

      - name: Download latest sing-box Android arm64 binary into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          SB_VER="1.10.7"
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-android-arm64.tar.gz" -o sb.tar.gz || true
          if [ -f sb.tar.gz ]; then
            tar -xzf sb.tar.gz
            find . -name "sing-box" -type f -exec cp {} android/app/src/main/jniLibs/libsingbox.so \;
            cp android/app/src/main/jniLibs/libsingbox.so android/app/src/main/jniLibs/arm64-v8a/libsingbox.so
            mkdir -p android/app/src/main/jniLibs/armeabi-v7a
            cp android/app/src/main/jniLibs/libsingbox.so android/app/src/main/jniLibs/armeabi-v7a/libsingbox.so
            mkdir -p android/app/src/main/jniLibs/x86_64
            cp android/app/src/main/jniLibs/libsingbox.so android/app/src/main/jniLibs/x86_64/libsingbox.so
            chmod +x android/app/src/main/jniLibs/*/libsingbox.so || true
            rm -rf sb.tar.gz sing-box-*
          fi

      - name: Install Flutter dependencies & build kernel snapshot
        run: |
          flutter pub get
          flutter precache --android

      - name: Build APK using pure Gradle (bypassing flutter build wrapper)
        run: |
          cd android
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintRelease
          cd ..

      - name: Locate and Rename APKs
        run: |
          mkdir -p output_apks
          find android/app/outputs/flutter-apk -name "*.apk" -exec cp {} output_apks/ \;
          cp output_apks/app-arm64-v8a-release.apk Wave-arm64-v8a-release.apk || cp output_apks/*.apk Wave-arm64-v8a-release.apk
          cp output_apks/app-release.apk Wave-universal-release.apk || cp output_apks/*.apk Wave-universal-release.apk

      - name: Upload Wave APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Android-APK
          path: |
            Wave-arm64-v8a-release.apk
            Wave-universal-release.apk

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Wave VPN v1.0.${{ github.run_number }}"
          body: "Автоматическая сборка Wave VPN (Sing-box Core)."
          files: |
            Wave-arm64-v8a-release.apk
            Wave-universal-release.apk
