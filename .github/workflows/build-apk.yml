name: Build Wave APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: v1.10.7   # libbox API in WaveVpnService.kt is written against this tag
  FLUTTER_VERSION: 3.32.8     # android/*.gradle.kts match this Flutter template
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    name: Wave APK (sing-box libbox core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAVE_KS_PASS: ${{ secrets.WAVE_KS_PASS }}
      WAVE_KEY_ALIAS: ${{ secrets.WAVE_KEY_ALIAS }}
      WAVE_KEY_PASS: ${{ secrets.WAVE_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK / NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache libbox.aar
        id: libbox
        uses: actions/cache@v4
        with:
          path: libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-ndk${{ env.NDK_VERSION }}

      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: "1.23.x"

      - name: Build libbox.aar from sing-box source
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${SING_BOX_VERSION}" https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          go run ./cmd/internal/build_libbox -target android
          cp libbox.aar "$GITHUB_WORKSPACE/libbox.aar"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android scaffold (only files that are missing in the repo)
        run: |
          flutter create --platforms=android --org com.wave --project-name vpn _scaffold
          cp -rn _scaffold/android/. android/
          rm -rf _scaffold
          mkdir -p android/app/libs
          cp libbox.aar android/app/libs/libbox.aar

      - name: Release keystore (optional secret WAVE_KEYSTORE_B64)
        env:
          KS_B64: ${{ secrets.WAVE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wave.jks"
            echo "WAVE_KEYSTORE=$RUNNER_TEMP/wave.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: signing with the debug key"
          fi

      - run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/Wave-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Wave-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/Wave-x86_64-release.apk

      - name: Build universal APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/Wave-universal-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wave-Android-APK
          path: dist/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Wave VPN v1.0.${{ github.run_number }}
          body: Автосборка Wave (sing-box ${{ env.SING_BOX_VERSION }}, libbox).
          files: dist/*.apk
