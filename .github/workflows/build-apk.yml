name: Build Wave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Wave Android APK (Sing-box Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Google Maven Central Mirror (Fix HTTP 429)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'GRADLE_EOF' > ~/.gradle/init.d/mirror.init.gradle
          def googleMavenMirror = "https://maven-central.storage-download.googleapis.com/maven2/"
          allprojects {
              buildscript {
                  repositories {
                      maven { url googleMavenMirror }
                      google()
                  }
              }
              repositories {
                  maven { url googleMavenMirror }
                  google()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url googleMavenMirror }
                      google()
                      gradlePluginPortal()
                  }
              }
              settings.dependencyResolutionManagement {
                  repositories {
                      maven { url googleMavenMirror }
                      google()
                  }
              }
          }
          GRADLE_EOF
          cat << 'PROP_EOF' >> ~/.gradle/gradle.properties
          org.gradle.internal.http.socketTimeout=120000
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.MaxRetries=5
          PROP_EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing Android scaffold if needed
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create --platforms=android --org com.wave --project-name wave .
          fi
          cp -f android_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/wave/vpn
          cp -f android_src/MainActivity.kt android/app/src/main/kotlin/com/wave/vpn/MainActivity.kt
          cp -f android_src/WaveVpnService.kt android/app/src/main/kotlin/com/wave/vpn/WaveVpnService.kt
          # Also inject Google mirror directly into Flutter's own gradle tool build
          if [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' "$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts" || true
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()|g' android/settings.gradle.kts || true
          fi

      - name: Download latest sing-box Android arm64 binary into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          SB_VER="1.10.7"
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-android-arm64.tar.gz" -o sb.tar.gz || true
          if [ -f sb.tar.gz ]; then
            tar -xzf sb.tar.gz
            find . -name "sing-box" -type f -exec cp {} android/app/src/main/jniLibs/arm64-v8a/libsingbox.so \;
            chmod +x android/app/src/main/jniLibs/arm64-v8a/libsingbox.so || true
            rm -rf sb.tar.gz sing-box-*
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APKs (Split per ABI + Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs for clarity
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Wave-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk Wave-universal-release.apk

      - name: Upload Wave APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Android-APK
          path: |
            Wave-arm64-v8a-release.apk
            Wave-universal-release.apk

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Wave VPN v1.0.${{ github.run_number }}"
          body: "Автоматическая сборка Wave VPN (Sing-box Core, Happ/Incy/VLESS/Hysteria2/TUIC/WireGuard)."
          files: |
            Wave-arm64-v8a-release.apk
            Wave-universal-release.apk
